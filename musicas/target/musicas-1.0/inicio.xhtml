<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml">

    <ui:define name="titulo">Página inicial</ui:define>

    <ui:define name="conteudo">
        <h2>Bem Vindo, #{usuarioBean.usuarioLogado.nome}</h2>
        <p>Login: #{usuarioBean.usuarioLogado.login}</p>
        
        <h3>Editar nome</h3>
        <h:form>
            <h:outputLabel value="Novo nome:" for="nome"/>
            <h:inputText id="nome" value="#{usuarioBean.nome}" required="true"/>

            <h:commandButton value="Atualizar" action="#{usuarioBean.atualizarNome()}"/>
        </h:form>
    </ui:define>

</ui:composition>
