<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml">
    <ui:define name="titulo">Cadastro de Banda</ui:define>
    <ui:define name="conteudo">
        <<h1>Cadastro de Banda</h1>
        
        <h:form>
            <h:panelGrid columns="2" cellpadding="5">
                <h:outputLabel for="nome" value="Nome da Banda:"/>
                <h:inputText id="nome" value="#{bandasBean.nomeBanda}" required="true"/>
            </h:panelGrid>

            <h:commandButton value="Salvar" action="#{bandasBean.cadastrar()}"/>
            <h:outputLink value="bandas.xhtml">
                Voltar para lista
            </h:outputLink>

            <h:outputText value="#{bandasBean.mensagem}" style="color:blue"/>
        </h:form>
    </ui:define>
</ui:composition>
