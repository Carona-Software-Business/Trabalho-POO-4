<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Login</title>

        <style>
            body {
                font-family: "Segoe UI", Arial, sans-serif;
                margin: 0;
                padding: 0;
                background: linear-gradient(135deg, #1f3b73, #6b11c9);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .form-container {
                width: 380px;
                background: white;
                padding: 32px;
                border-radius: 14px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.25);
                animation: fadeIn 0.4s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to   {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            h1 {
                text-align: center;
                color: #1f3b73;
                margin-top: 0;
                margin-bottom: 18px;
                font-size: 1.8em;
            }

            p {
                text-align: center;
                margin-bottom: 22px;
                color: #444;
            }

            p a {
                color: #6b11c9;
                font-weight: bold;
                text-decoration: none;
            }

            p a:hover {
                text-decoration: underline;
            }

            h\\:outputLabel {
                display: block;
                font-weight: 600;
                color: #333;
                margin-top: 14px;
                margin-bottom: 4px;
            }

            input[type=text],
            input[type=password] {
                width: 100%;
                padding: 9px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-size: 1em;
                transition: all .2s;
            }

            input[type=text]:focus,
            input[type=password]:focus {
                border-color: #6b11c9;
                box-shadow: 0 0 4px rgba(107,17,201,0.4);
                outline: none;
            }

            .btn {
                width: 100%;
                padding: 12px;
                background: #6b11c9;
                color: white;
                font-weight: bold;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1.05em;
                margin-top: 25px;
                transition: 0.2s;
            }

            .btn:hover {
                background: #5412a8;
            }

            .messages {
                margin-top: 15px;
                padding: 10px;
                background: #ffe5e5;
                border-left: 4px solid #cc0000;
                color: #b30000;
                border-radius: 6px;
                font-size: 0.9em;
            }
        </style>
    </h:head>

    <h:body>
        <div class="form-container">

            <h1>Login</h1>
            <p>Não tem cadastro? Faça <h:link value=" aqui" outcome="cadastro"/></p>

            <h:form>
                <h:outputLabel value="Login:" for="login"/>
                <h:inputText id="login" value="#{usuarioBean.login}" required="true"/>

                <h:outputLabel value="Senha:" for="senha"/>
                <h:inputSecret id="senha" value="#{usuarioBean.senha}" required="true"/>

                <h:commandButton value="Entrar" action="#{usuarioBean.logar()}" styleClass="btn"/>

                <h:messages globalOnly="true" styleClass="messages" />
            </h:form>

        </div>
    </h:body>

</html>
