<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="template.xhtml">

    <ui:define name="titulo">Cadastro de Gênero</ui:define>

    <ui:define name="conteudo">

        <h2>Cadastro de Gênero</h2>

        <h:form>

            <h:panelGrid columns="2" cellpadding="5">

                <h:outputLabel for="nome" value="Nome do gênero:" />
                <h:inputText id="nome"
                             label="nome"
                             value="#{generosBean.nomeGenero}">
                    <f:validateLength maximum="100" />
                    <f:validateRequired />
                </h:inputText>
                <h:message for="nome" style="color:red;" />

            </h:panelGrid>

            <br/>

            <h:commandButton value="Cadastrar"
                             action="#{generosBean.cadastrar()}" />

            <h:outputLink value="generos.xhtml" style="margin-left:20px;">
                Voltar para lista
            </h:outputLink>

            <br/><br/>

            <h:outputText value="#{generosBean.mensagem}" style="color:blue;" />

        </h:form>

    </ui:define>

</ui:composition>
