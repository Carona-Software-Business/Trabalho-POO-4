<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title><ui:insert name="titulo">Sistema de Músicas</ui:insert></title>

        <style>
            /* ====== ESTILO GERAL ====== */

            body {
                font-family: "Segoe UI", Arial, sans-serif;
                margin: 0;
                padding: 0;
                background: #f7f8fa;
            }

            header {
                background: linear-gradient(90deg, #1f3b73, #6b11c9);
                color: white;
                padding: 20px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            }

            header h1 {
                margin: 0;
                font-size: 1.9em;
                letter-spacing: 0.5px;
            }

            nav {
                margin-top: 10px;
            }

            nav a {
                color: #e2e6ff;
                text-decoration: none;
                margin-right: 25px;
                font-weight: bold;
                padding: 5px 8px;
                border-radius: 6px;
                transition: background 0.2s;
            }

            nav a:hover {
                background: rgba(255,255,255,0.2);
            }

            main {
                padding: 20px 30px;
                min-height: 450px;
            }

            footer {
                background-color: #ececec;
                text-align: center;
                padding: 12px;
                font-size: 0.85em;
                color: #555;
                border-top: 1px solid #d5d5d5;
            }


            /* ====================================================
               ESTILO PARA tabelas JSF
               ==================================================== */

            table.music-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                background: white;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            }

            .music-table th {
                background: #6b11c9;
                color: white;
                padding: 10px;
                text-align: left;
                font-size: 0.95em;
                letter-spacing: 0.5px;
            }

            .music-table td {
                padding: 10px;
                border-bottom: 1px solid #eee;
                font-size: 0.92em;
            }

            .music-table tr:nth-child(even) {
                background: #f5f0ff;
            }

            .music-table tr:hover {
                background: #e9dfff;
            }


            /* ========= BOTÕES PADRÃO ========= */

            input[type="submit"],
            button,
            input[type="button"] {
                padding: 7px 14px;
                background: #6b11c9;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
                transition: 0.2s;
                margin-right: 10px;
            }

            input[type="submit"]:hover,
            button:hover,
            input[type="button"]:hover {
                background: #5412a8;
            }

        </style>
    </h:head>

    <h:body>
        
        <h:panelGroup rendered="#{not usuarioBean.logado}">
            <h:messages/>
            <h:outputText value="Erro: você precisa fazer login para acessar esta página."/>
            <h:link value="Ir para login" outcome="login"/>
        </h:panelGroup>
        
        <h:panelGroup rendered="#{usuarioBean.logado}">
            <header>
                <h1>Sistema de Músicas</h1>
                <nav>
                    <h:link value="Início" outcome="inicio"/>
                    <h:link value="Gêneros" outcome="generos"/>
                    <h:link value="Músicas" outcome="musicas"/>
                </nav>
            </header>

            <main>
                <ui:insert name="conteudo">
                    <p>Bem-vindo ao Sistema de Músicas!</p>
                </ui:insert>
            </main>

            <footer>
                Sistema de músicas — 2025
            </footer>
        </h:panelGroup> 
    </h:body>

</html>
