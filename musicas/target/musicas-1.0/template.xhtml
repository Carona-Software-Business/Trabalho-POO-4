<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title><ui:insert name="titulo">Sistema de Músicas</ui:insert></title>

        <style>
            /* ============================
               ESTILO GLOBAL
            ============================ */

            body {
                margin: 0;
                padding: 0;
                background: #eef2f3;
                font-family: "Inter", "Segoe UI", Arial, sans-serif;
                color: #2d2d2d;
            }

            /* Cabeçalho */
            header {
                background: #0d2538;
                color: #ffffff;
                padding: 25px 40px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            }

            header h1 {
                font-size: 2.1em;
                font-weight: 600;
                margin: 0;
            }

            nav {
                display: flex;
                gap: 18px;
            }

            nav a {
                text-decoration: none;
                padding: 8px 15px;
                background: #1b4358;
                color: #d8f3fb;
                border-radius: 20px;
                font-weight: 500;
                transition: 0.3s;
            }

            nav a:hover {
                background: #2b6078;
                color: white;
            }

            /* Área principal */
            main {
                padding: 35px 50px;
                min-height: 450px;
            }

            /* Rodapé */
            footer {
                background: #dfe6e9;
                color: #4a4a4a;
                text-align: center;
                padding: 12px;
                font-size: 0.9em;
                margin-top: 40px;
                border-top: 1px solid #c7d1d4;
            }

            /* ============================
               TABELAS ESTILIZADAS
            ============================ */

            table.music-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 25px;
                background: white;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            }

            .music-table th {
                background: #0d2538;
                color: #e1f5fe;
                padding: 14px;
                text-align: left;
                font-size: 0.95em;
                letter-spacing: 0.5px;
            }

            .music-table td {
                padding: 12px;
                font-size: 0.95em;
                border-bottom: 1px solid #f1f1f1;
            }

            .music-table tr:nth-child(even) {
                background: #f6fbfc;
            }

            .music-table tr:hover {
                background: #e3f6ff;
            }

            /* ============================
               BOTÕES
            ============================ */

            input[type="submit"],
            button,
            input[type="button"] {
                padding: 9px 18px;
                background: #16a085;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
                letter-spacing: 0.3px;
                transition: 0.25s;
            }

            input[type="submit"]:hover,
            button:hover,
            input[type="button"]:hover {
                background: #13856e;
            }

            /* Mensagens */
            .error {
                color: #c0392b;
                font-weight: bold;
                margin-bottom: 10px;
            }
        </style>
    </h:head>

    <h:body>

        <!-- Caso não esteja logado -->
        <h:panelGroup rendered="#{not usuarioBean.logado}">
            <h:messages styleClass="error"/>
            <h:outputText value="Você precisa fazer login para acessar esta página."/>
            <br/><br/>
            <h:link value="Ir para login" outcome="login"/>
        </h:panelGroup>

        <!-- Caso esteja logado -->
        <h:panelGroup rendered="#{usuarioBean.logado}">
            <header>
                <h1>Sistema de Músicas</h1>
                <nav>
                    <h:link value="Início" outcome="inicio"/>
                    <h:link value="Gêneros" outcome="generos"/>
                    <h:link value="Bandas" outcome="bandas"/>
                    <h:link value="Músicas" outcome="musicas"/>
                </nav>
            </header>

            <main>
                <ui:insert name="conteudo">
                    <p>Bem-vindo ao Sistema de Músicas!</p>
                </ui:insert>
            </main>

            <footer>
                Sistema de Músicas — 2025
            </footer>
        </h:panelGroup>

    </h:body>
</html>
