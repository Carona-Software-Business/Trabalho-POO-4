<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h1>Login</h1>
        
        <p>Não tem um login? Então faça <h:link value=" cadastro" outcome="cadastro"/></p>
        
        <h:form>
            <h:outputLabel value="Login:" for="login"/>
            <h:inputText id="login" value="#{usuarioBean.login}" required="true"/>

            <h:outputLabel value="Senha:" for="senha"/>
            <h:inputSecret id="senha" value="#{usuarioBean.senha}" required="true"/>

            <h:commandButton value="Entrar" action="#{usuarioBean.logar()}"/>
            
            <h:messages globalOnly="true" showDetail="false" style="color:red;" />
            <h:messages globalOnly="true" showSummary="false" showDetail="true" style="color:red;" />
        </h:form>
    </h:body>
</html>
