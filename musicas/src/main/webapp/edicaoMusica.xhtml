<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="template.xhtml">

    <ui:define name="titulo">Edição de Música</ui:define>

    <ui:define name="conteudo">

        <h:form>

            <h:panelGrid columns="2" cellpadding="5">

                <h:outputLabel value="ID da música:" />
                <h:outputText value="#{musicasBean.musicaSelecionada.id}" />

                <h:outputLabel for="nome" value="Nome da música:" />
                <h:inputText id="nome"
                             value="#{musicasBean.nomeMusica}">
                    <f:validateLength maximum="100" />
                    <f:validateRequired />
                </h:inputText>
                <h:message for="nome" style="color:red;" />

                <h:outputLabel for="genero" value="Gênero:" />
                <h:selectOneListbox id="genero"
                                    value="#{musicasBean.generoId}">
                    <f:selectItems value="#{generosBean.generos}"
                                   var="g"
                                   itemValue="#{g.id}"
                                   itemLabel="#{g.nome}" />
                    <f:validateRequired />
                </h:selectOneListbox>
                <h:message for="genero" style="color:red;" />
                
                <h:outputLabel for="banda" value="Banda:" />
                <h:selectOneListbox id="banda"
                                    value="#{musicasBean.bandaId}">
                    <f:selectItems value="#{bandasBean.bandas}"
                                   var="g"
                                   itemValue="#{g.id}"
                                   itemLabel="#{g.nome}" />
                    <f:validateRequired />
                </h:selectOneListbox>
                <h:message for="banda" style="color:red;" />

            </h:panelGrid>

            <br/>

            <h:commandButton value="Salvar alterações"
                             action="#{musicasBean.salvarEdicao()}" />

        </h:form>

        <br/>

        <h:outputText value="#{musicasBean.mensagem}" style="color:blue;" />

    </ui:define>

</ui:composition>
