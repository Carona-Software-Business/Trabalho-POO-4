<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title><ui:insert name="titulo">Sistema de Músicas</ui:insert></title>

        <style>
            /* ====== ESTILO GERAL ====== */

            body {
                font-family: "Segoe UI", Arial, sans-serif;
                margin: 0;
                padding: 0;
                background: #eef1f7;
            }

            /* ===== HEADER ===== */

            header {
                background: #182848;
                background: linear-gradient(90deg, #182848 0%, #4b6cb7 100%);
                color: white;
                padding: 22px;
                box-shadow: 0 3px 7px rgba(0,0,0,0.25);
            }

            header h1 {
                margin: 0;
                font-size: 2em;
                font-weight: 600;
            }

            nav {
                margin-top: 12px;
            }

            nav a {
                color: #dfe7ff;
                text-decoration: none;
                margin-right: 20px;
                font-weight: bold;
                padding: 6px 10px;
                font-size: 0.95em;
                border-radius: 8px;
                transition: 0.25s;
            }

            nav a:hover {
                background: rgba(255,255,255,0.25);
            }

            /* ===== MAIN ===== */

            main {
                padding: 30px 40px;
                min-height: 500px;
            }

            /* ===== FOOTER ===== */

            footer {
                background-color: #dfe3ea;
                text-align: center;
                padding: 14px;
                font-size: 0.85em;
                color: #444;
                border-top: 1px solid #c2c6d0;
            }

            /* ===== TITULOS ===== */

            h2, h3 {
                margin-top: 20px;
                color: #2d2f3a;
            }

            /* ========================
               FORMULÁRIOS / INPUTS
               ======================== */

            input[type="text"],
            input[type="password"],
            input[type="search"],
            input[type="number"],
            textarea {
                width: 260px;
                padding: 8px 10px;
                border: 1px solid #bfc5d2;
                border-radius: 6px;
                margin-bottom: 8px;
                font-size: 0.95em;
                background: white;
                transition: 0.2s;
            }

            input[type="text"]:focus,
            input[type="password"]:focus {
                border-color: #4b6cb7;
                box-shadow: 0 0 3px #4b6cb7;
            }

            /* ====== BOTÕES ====== */

            input[type="submit"],
            button,
            input[type="button"],
            .h-btn {
                padding: 8px 14px;
                background: #4b6cb7;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                font-size: 0.9em;
                transition: background 0.2s, transform 0.1s;
                margin: 5px;
            }

            input[type="submit"]:hover,
            button:hover,
            input[type="button"]:hover,
            .h-btn:hover {
                background: #3a5898;
                transform: translateY(-2px);
            }

            /* ====== TABELAS ====== */

            .music-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 25px;
                background: white;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 3px 7px rgba(0,0,0,0.15);
            }

            .music-table th {
                background: #4b6cb7;
                color: white;
                padding: 12px;
                text-align: left;
                font-size: 0.95em;
                letter-spacing: 0.5px;
            }

            .music-table td {
                padding: 12px;
                border-bottom: 1px solid #efefef;
            }

            .music-table tr:nth-child(even) {
                background: #f5f7ff;
            }

            .music-table tr:hover {
                background: #e8edff;
            }

            /* LINKS PADRÃO */

            a {
                color: #4b6cb7;
                font-weight: bold;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

        </style>

    </h:head>

    <h:body>

        <!-- Caso não esteja logado -->
        <h:panelGroup rendered="#{not usuarioBean.logado}">
            <h:messages styleClass="error"/>
            <h:outputText value="Você precisa fazer login para acessar esta página."/>
            <br/><br/>
            <h:link value="Ir para login" outcome="login"/>
        </h:panelGroup>

        <!-- Caso esteja logado -->
        <h:panelGroup rendered="#{usuarioBean.logado}">
            <header>
                <h1>Sistema de Músicas</h1>
                <nav>
                    <h:link value="Início" outcome="inicio"/>
                    <h:link value="Gêneros" outcome="generos"/>
                    <h:link value="Bandas" outcome="bandas"/>
                    <h:link value="Músicas" outcome="musicas"/>
                </nav>
            </header>

            <main>
                <ui:insert name="conteudo">
                    <p>Bem-vindo ao Sistema de Músicas!</p>
                </ui:insert>
            </main>

            <footer>
                Sistema de Músicas — 2025
            </footer>
        </h:panelGroup>

    </h:body>
</html>
