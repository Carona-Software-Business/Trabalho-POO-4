<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml"
                xmlns:f="jakarta.faces.core">
    <ui:define name="titulo">Lista de Gêneros</ui:define>
    <ui:define name="conteudo">
        <h:form>
            <h:panelGrid columns="3" cellpadding="5">
                <h:outputLabel for="nome" value="Busca por nome:" />
                <h:inputText id="nome" value="#{generosBean.nomeBusca}"/>
                <h:commandButton value="Buscar" action="#{generosBean.buscarPorNomeParcial()}"/>
            </h:panelGrid>
            <h:outputText value ="#{generosBean.mensagem}"/>
            <h:dataTable value="#{generosBean.generos}" var="g" border="1" styleClass="music-table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                        #{g.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Nome</f:facet>
                        #{g.nome}
                </h:column>
                <h:column>
                    <f:facet name="header">Ações</f:facet>
                    <h:commandButton value="Remover" action="#{generosBean.removerGenero(g)}"/>
                </h:column>
            </h:dataTable>
            <h:commandButton value="Listar todos" action="#{generosBean.listar()}"/>
        </h:form>
    </ui:define>
</ui:composition>
