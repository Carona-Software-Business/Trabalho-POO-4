<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="template.xhtml">

    <ui:define name="titulo">Lista de Gêneros</ui:define>

    <ui:define name="conteudo">

        <h:form>

            <!-- ====== CARD DE BUSCA ====== -->
            <div style="background:white; padding:20px; width:450px;
                 border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
                 margin-bottom:25px;">

                <h3 style="margin-top:0;">Buscar gênero</h3>

                <h:panelGrid columns="3" cellpadding="8"
                             style="align-items:center;">

                    <h:outputLabel for="nome" value="Nome:"/>
                    <h:inputText id="nome" value="#{generosBean.nomeBusca}"
                                 style="width:150px;" />
                    <h:commandButton value="Buscar" action="#{generosBean.buscarPorNomeParcial()}"/>

                </h:panelGrid>

                <h:outputText value="#{generosBean.mensagem}"
                              style="color:#444; margin-top:10px; display:block;" />
            </div>

            <!-- ====== TABELA LISTA DE GÊNEROS ====== -->
            <h2>Gêneros cadastrados</h2>

            <h:dataTable value="#{generosBean.generos}" var="g"
                         border="0" styleClass="music-table">

                <h:column>
                    <f:facet name="header">ID</f:facet>
                        #{g.id}
                </h:column>

                <h:column>
                    <f:facet name="header">Nome</f:facet>
                    <h:outputLink value="musicasPorGenero.xhtml?nomeGenero=#{g.nome}" target="_blank">
                        #{g.nome}
                    </h:outputLink>
                </h:column>

                <h:column>
                    <f:facet name="header">Ações</f:facet>

                    <h:panelGroup rendered="#{usuarioBean.usuarioLogado.administrador}" layout="block">
                        <h:commandButton value="Editar"
                                         action="#{generosBean.editarGenero(g)}"
                                         style="margin-right:6px;" />

                        <h:commandButton value="Remover"
                                         action="#{generosBean.removerGenero(g)}" />
                    </h:panelGroup>

                </h:column>

            </h:dataTable>

            <!-- ====== BOTÕES FINAIS ====== -->
            <div style="margin-top:20px;">
                <h:commandButton value="Listar todos"
                                 action="#{generosBean.listar()}"
                                 style="margin-right:10px;" />

                <h:commandButton value="Cadastrar novo gênero"
                                 action="cadastroGenero.xhtml" />
            </div>

        </h:form>

    </ui:define>

</ui:composition>
