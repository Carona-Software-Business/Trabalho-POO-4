<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml"
                xmlns:f="jakarta.faces.core">
    <ui:define name="titulo">Lista de Músicas</ui:define>
    <ui:define name="conteudo">
        <h:form>    

            <h3>Buscar músicas</h3>

            <div style="background:#fff; padding:15px; border-radius:10px;
                 box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:20px;">

                <h:panelGrid columns="3" cellpadding="8">
                    <h:outputLabel for="nome" value="Nome:" />
                    <h:inputText id="nome" value="#{musicasBean.nomeMusica}"/>
                    <h:commandButton value="Buscar" action="#{musicasBean.buscaPorNome()}"/>

                    <h:outputLabel for="genero" value="Gênero:" />
                    <h:inputText id="genero" value="#{musicasBean.nomeGenero}"/>
                    <h:commandButton value="Buscar" action="#{musicasBean.buscaPorGenero()}"/>

                    <h:outputLabel for="banda" value="Banda:" />
                    <h:inputText id="banda" value="#{musicasBean.nomeBanda}"/>
                    <h:commandButton value="Buscar" action="#{musicasBean.buscaPorBanda()}"/>
                </h:panelGrid>
            </div>


            <h:outputText value ="#{musicasBean.mensagem}"/>

            <h:panelGroup rendered="#{usuarioBean.logado}">
                <h2>Minhas músicas favoritas</h2>

                <h:dataTable value="#{usuarioBean.usuarioLogado.musicasFavoritas}" var="m" border="1" styleClass="music-table">

                    <h:column>
                        <f:facet name="header">ID</f:facet>
                            #{m.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Nome</f:facet>
                            #{m.nome}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Gênero</f:facet>
                            #{m.genero.nome}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Banda</f:facet>
                            #{m.banda.nome}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Ações</f:facet>

                        <h:commandButton value="Desfavoritar" action="#{musicasBean.favoritar(m)}"/>

                        <h:panelGroup rendered="#{usuarioBean.usuarioLogado.administrador}">
                            <h:commandButton value="Editar" action="#{musicasBean.editarMusica(m)}"/>
                            <h:commandButton value="Remover" action="#{musicasBean.removerMusica(m)}"/>
                        </h:panelGroup>

                    </h:column>

                </h:dataTable>

                <br/><br/>
            </h:panelGroup>

            <h2>Todas musícas</h2>
            <h:dataTable value="#{musicasBean.musicas}" var="m" border="1" styleClass="music-table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                        #{m.id}
                </h:column>

                <h:column>
                    <f:facet name="header">Favorita</f:facet>
                    <h:outputText value="#{usuarioBean.usuarioLogado.musicasFavoritas.contains(m) ? 'Sim' : 'Não'}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Nome</f:facet>
                        #{m.nome}
                </h:column>

                <h:column>
                    <f:facet name="header">Gênero</f:facet>
                        #{m.genero.nome}
                </h:column>

                <h:column>
                    <f:facet name="header">Banda</f:facet>
                        #{m.banda.nome}
                </h:column>

                <h:column>
                    <f:facet name="header">Ações</f:facet>
                    <h:commandButton value="Favoritar" action="#{musicasBean.favoritar(m)}"/>

                    <h:panelGroup rendered="#{usuarioBean.usuarioLogado.administrador}">
                        <h:commandButton value="Editar" action="#{musicasBean.editarMusica(m)}"/>

                        <h:commandButton value="Remover" action="#{musicasBean.removerMusica(m)}"/>
                    </h:panelGroup>
                </h:column>

            </h:dataTable>

            <h:commandButton value="Listar todas" action="#{musicasBean.listar()}"/>
            <h:commandButton value="Cadastrar nova música" action="cadastroMusica.xhtml"/>
        </h:form>
    </ui:define>
</ui:composition>
