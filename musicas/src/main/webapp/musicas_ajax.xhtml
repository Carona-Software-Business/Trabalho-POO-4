<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml"
                xmlns:f="jakarta.faces.core">
    <ui:define name="titulo">Lista de Músicas</ui:define>
    <ui:define name="conteudo">
        <h:form>
            <h:panelGrid columns="2" cellpadding="5">
                <h:outputLabel for="nome" value="Busca por nome:" />
                <h:inputText id="nome" value="#{musicasBean.nomeMusica}">
                    <f:ajax event="keyup" listener="#{musicasBean.buscaPorNome()}" 
                            render="tabelaMusicas mensagem" />
                </h:inputText>
                <h:outputLabel for="genero" value="Busca por gênero:" />
                <h:inputText id="genero" value="#{musicasBean.nomeGenero}">
                    <f:ajax event="keyup" listener="#{musicasBean.buscaPorGenero()}"
                            render="tabelaMusicas mensagem" />
                </h:inputText>
            </h:panelGrid>
            <h:outputText id="mensagem" value ="#{musicasBean.mensagem}"/>
            <h:dataTable id="tabelaMusicas" value="#{musicasBean.musicas}" 
                         var="m" border="1" styleClass="music-table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                        #{m.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Nome</f:facet>
                        #{m.nome}
                </h:column>
                <h:column>
                    <f:facet name="header">Gênero</f:facet>
                        #{m.genero.nome}
                </h:column>
                <h:column>
                    <f:facet name="header">Ações</f:facet>
                    <h:commandButton value="Remover" action="#{musicasBean.removerMusica(m)}"/>
                    
                    <h:commandButton value="Editar" action="#{musicasBean.editarMusica(m)}"/>
                </h:column>
            </h:dataTable>
            <h:commandButton value="Listar todas" action="#{musicasBean.listar()}"/>
        </h:form>
    </ui:define>
</ui:composition>
