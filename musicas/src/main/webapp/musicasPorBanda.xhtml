<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml"
                xmlns:f="jakarta.faces.core">
    <ui:define name="titulo">Músicas por Banda</ui:define>
    <ui:define name="conteudo">
        <h:form>
            <h:outputText value="#{musicasPorBandaBean.mensagem}" style="font-weight:bold"/>

            <h:dataTable value="#{musicasPorBandaBean.musicas}" var="m" border="1" styleClass="music-table">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{m.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Nome</f:facet>
                    #{m.nome}
                </h:column>
                <h:column>
                    <f:facet name="header">Banda</f:facet>
                    #{m.banda.nome}
                </h:column>
            </h:dataTable>

            <h:outputLink value="bandas.xhtml">
                Voltar para bandas
            </h:outputLink>
        </h:form>
    </ui:define>
</ui:composition>
