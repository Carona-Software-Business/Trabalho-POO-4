<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml">

    <ui:define name="titulo">Página inicial</ui:define>

    <ui:define name="conteudo">
        <h2>Olá, #{usuarioBean.usuarioLogado.nome} 👋</h2>

        <div style="background:white; padding:20px; border-radius:10px;
             margin-bottom:20px; box-shadow:0 2px 6px rgba(0,0,0,0.1);">

            <p><b>Login:</b> #{usuarioBean.usuarioLogado.login}</p>
            <p>Veja suas <h:link value=" músicas favoritas" outcome="musicas"/></p>
        </div>


        <h3>Editar nome</h3>
        <div style="background:white; padding:15px; border-radius:10px;
             width:350px; box-shadow:0 2px 6px rgba(0,0,0,0.1);">
            <h:form>
                <h:panelGrid columns="2" cellpadding="8">
                    <h:outputLabel for="nome" value="Novo nome:"/>
                    <h:inputText id="nome" value="#{usuarioBean.nome}" required="true"/>
                </h:panelGrid>
                <h:commandButton value="Atualizar" action="#{usuarioBean.atualizarNome()}"/>
            </h:form>
        </div>

        <h3>Editar senha</h3>

        <div style="background:white; padding:20px; width:350px;
             border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-top:15px;">

            <h:form>

                <h:panelGrid columns="2" cellpadding="8">

                    <h:outputLabel for="senha" value="Senha atual:"/>
                    <h:inputSecret id="senha" value="#{usuarioBean.senha}" required="true"/>

                    <h:outputLabel for="novaSenha" value="Nova senha:"/>
                    <h:inputSecret id="novaSenha" value="#{usuarioBean.novaSenha}" required="true"/>

                </h:panelGrid>

                <h:commandButton value="Atualizar" action="#{usuarioBean.atualizarSenha()}"/>

                <!-- Mensagens de erro -->
                <div style="margin-top:12px;">
                    <h:messages globalOnly="true" showSummary="false" showDetail="true" style="color:red;" />
                </div>

            </h:form>

        </div>

    </ui:define>

</ui:composition>
